<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bisnan Calling</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 20px; }
        .peer-row { margin: 10px 0; padding: 10px; background: #333; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 6px 12px; background: #4CAF50; border: none; color: white; border-radius: 4px; cursor: pointer; }
        button.hangup-btn { background: #f44336; }
        button:disabled { background: #555; cursor: not-allowed; }
        #videoGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .video-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; height: 200px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .peer-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 2px 6px; font-size: 12px; border-radius: 4px; }
    </style>
</head>
<body style="display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0;"> 
    <button id="mediaToggleBtn" onclick="toggleLocalMedia()" style="display: flex; align-items: center; justify-content: center;">Start Camera</button> 
    <br>  
    <div style="width: 120px; height: 120px; background: #000; border: 2px solid coral; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;"> 
        <video id="localVideo" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video> 
    </div>
    <br> 
    <div id="peerListContainer" style="display: flex; align-items: center; justify-content: center;"> </div> 
    <div id="videoGrid" style="border: 2px solid coral; border-radius: 8px; display: flex; align-items: center; justify-content: center;"></div> 
    <div style="display: flex; align-items: center; justify-content: center;"><span id="myIdDisplay" style="color: #ff9800; font-weight: bold;">Connecting...</span></div>

    <script>
        const rtcConfig = { 
          iceServers: [
              {
                urls: "stun:stun.relay.metered.ca:80",
              },
              {
                urls: "turn:standard.relay.metered.ca:80",
                username: "801acfb381f1738ba4e9e792",
                credential: "xb8Y+/nANmaFf1Um",
              },
              {
                urls: "turn:standard.relay.metered.ca:80?transport=tcp",
                username: "801acfb381f1738ba4e9e792",
                credential: "xb8Y+/nANmaFf1Um",
              },
              {
                urls: "turn:standard.relay.metered.ca:443",
                username: "801acfb381f1738ba4e9e792",
                credential: "xb8Y+/nANmaFf1Um",
              },
              {
                urls: "turns:standard.relay.metered.ca:443?transport=tcp",
                username: "801acfb381f1738ba4e9e792",
                credential: "xb8Y+/nANmaFf1Um",
              },
          ],
        };

        let ws = null;
        let localStream = null;
        let myId = null;
        let isMediaActive = false;
        const peerConnections = new Map();
        const iceQueues = new Map(); // Global holding queue for early ICE candidates

        // 1. ROBUST RECONNECTING WEBSOCKET WRAPPER
        function connectSignalingServer() {
            console.log("Establishing connection to signaling engine...");
            ws = new WebSocket('wss://family-video-signaler.onrender.com');

            ws.onopen = () => {
                console.log("WebSocket wire connected successfully.");
                
                const idDisplay = document.getElementById('myIdDisplay');
                
                if (isMediaActive && !myId) {
                    idDisplay.innerText = "Re-registering...";
                    ws.send(JSON.stringify({ 
                        type: 'register-browser', 
                        id: myId // If null, the server generates a new one. If populated, it re-binds your active session!
                    }));
                } else if (!isMediaActive) {
                    // Fix: Update the text when loading the page for the first time
                    idDisplay.innerText = "";
                    idDisplay.style.color = "#ff9800"; // Orange text showing it is ready but waiting for media
                }
            };


            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                const senderId = data.senderId;

                switch (data.type) {
                    case 'registered':
                        myId = data.id;
                        const idDisplay = document.getElementById('myIdDisplay');
                        idDisplay.innerText = "Connected as: " + myId;
                        idDisplay.style.color = "#4CAF50";
                        break;

                    case 'mesh-peer-list':
                        if (isMediaActive) {
                            renderPeerDirectory(data.peers);
                        }
                        break;
            
                    case 'offer':
                        if (!isMediaActive) break; 
                        console.log("Receiving call request from: " + senderId);
                        let pcOffer = createMeshPeerConnection(senderId);
                        try {
                            await pcOffer.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
                            
                            // Remote description is now set! Safely process any early queued candidates
                            await processIceQueue(senderId); 
                            
                            const answer = await pcOffer.createAnswer();
                            await pcOffer.setLocalDescription(answer);
                            ws.send(JSON.stringify({ type: 'answer', targetId: senderId, sdp: answer.sdp }));
                            togglePeerButton(senderId, true);
                        } catch (err) {
                            console.error("Error answering call:", err);
                        }
                        break;

                    case 'answer':
                        if (!isMediaActive) break;
                        const pcAnswer = peerConnections.get(senderId);
                        if (pcAnswer) {
                            await pcAnswer.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
                            console.log("Call handshaking completed with: " + senderId);
                            
                            // Remote description is now set! Safely process any early queued candidates
                            await processIceQueue(senderId);
                            
                            togglePeerButton(senderId, true);
                        }
                        break;

                    case 'ice-candidate':
                        if (!isMediaActive) break;
                        const pcCandidate = peerConnections.get(senderId);
                        
                        if (pcCandidate && pcCandidate.remoteDescription && data.candidate) {
                            // PeerConnection exists and remote description is set. Apply immediately.
                            await pcCandidate.addIceCandidate(new RTCIceCandidate(data.candidate));
                        } else if (data.candidate) {
                            // Race case: The candidate arrived too early (either RTCPeerConnection doesn't 
                            // exist yet, or it does but setRemoteDescription hasn't finished). Queue it up!
                            console.log(`Queueing early candidate from ${senderId} (PC exists: ${!!pcCandidate})`);
                            if (!iceQueues.has(senderId)) iceQueues.set(senderId, []);
                            iceQueues.get(senderId).push(data.candidate);
                        }
                        break;
            
                    case 'hangup':
                        const peerToDisconnect = data.senderId || data.targetId;
                        console.log("Remote peer requested hangup teardown: " + peerToDisconnect);
                        if (peerToDisconnect) {
                            teardownMeshPeer(peerToDisconnect);
                        }
                        break;
                }
            };

            ws.onclose = () => {
                console.warn("Signaling socket severed. Triggering scheduled revival...");
                myId = null; 
                
                if (isMediaActive) {
                    document.getElementById('myIdDisplay').innerText = "Reconnecting...";
                    document.getElementById('myIdDisplay').style.color = "#ff9800";
                } else {
                    document.getElementById('myIdDisplay').innerText = "Disconnected";
                    document.getElementById('myIdDisplay').style.color = "#f44336";
                }

                setTimeout(() => {
                    connectSignalingServer();
                }, 2000);
            };

            ws.onerror = (err) => {
                console.error("Socket error encountered:", err);
                ws.close();
            };
        }

        // Initialize socket loop immediately on page boot
        connectSignalingServer();

        // 2. MANAGE PRIVACY & HARDWARE TOGGLE
        async function toggleLocalMedia() {
            const btn = document.getElementById('mediaToggleBtn');
            
            if (!isMediaActive) {
                try {
                    console.log("User requested camera access. Launching hardware layers...");
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                    document.getElementById('localVideo').srcObject = localStream;
                    
                    isMediaActive = true;
                    btn.innerText = "Stop Camera";
                    btn.className = "privacy-btn active";
                    document.getElementById('myIdDisplay').innerText = "Registering...";
                    
                    // Inside toggleLocalMedia() -> when !isMediaActive is true
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ 
                            type: 'register-browser',
                            id: myId 
                        }));
                    }

                } catch (err) {
                    console.error("Camera access denied or blocked by user:", err);
                    alert("Could not start media: Please verify camera permissions.");
                    document.getElementById('myIdDisplay').innerText = "Offline (Permissions Blocked)";
                }
            } else {
                console.log("Privacy mode triggered. Destroying active pipelines...");
                cleanupAllConnections();
                
                isMediaActive = false;
                btn.innerText = "Start Camera";
                btn.className = "privacy-btn";
                
                myId = null; 
                document.getElementById('myIdDisplay').innerText = "Offline (Privacy Mode)";
                document.getElementById('myIdDisplay').style.color = "#ff9800";
                document.getElementById('peerListContainer').innerText = "";
            }
        }

        // 3. FORCE MOBILE RE-RENDER ON CLEANUP
        function cleanupAllConnections() {
            console.log("Dismantling room workspace, closing active channels...");
            
            if (ws && ws.readyState === WebSocket.OPEN && myId) {
                ws.send(JSON.stringify({ type: 'hangup', targetId: null }));
            }

            peerConnections.forEach((pc, peerId) => {
                try {
                    pc.onicecandidate = null;
                    pc.ontrack = null;
                    pc.close();
                } catch(e) { 
                    console.warn(e); 
                }
                const box = document.getElementById("box_" + peerId);
                if (box) box.remove();
            });
            peerConnections.clear();
            iceQueues.clear();

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    track.stop();
                    console.log(`Track successfully halted: ${track.kind}`);
                });
                localStream = null;
            }

            const localVid = document.getElementById('localVideo');
            if (localVid) {
                localVid.srcObject = null;
                localVid.removeAttribute('src');
                localVid.load(); 
            }
        }

        async function processIceQueue(peerId) {
            const pc = peerConnections.get(peerId);
            const queue = iceQueues.get(peerId);
            if (pc && pc.remoteDescription && queue) {
                console.log(`Draining ${queue.length} early queued candidates for ${peerId}`);
                while (queue.length > 0) {
                    const cand = queue.shift();
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(cand));
                    } catch (e) {
                        console.error("Error processing queued ICE candidate:", e);
                    }
                }
            }
        }

        function renderPeerDirectory(peers) {
            const container = document.getElementById('peerListContainer');
            container.innerHTML = ''; 
            let count = 0;

            const activePeerIds = peers.map(p => p.id);
            peerConnections.forEach((pc, peerId) => {
                if (!activePeerIds.includes(peerId)) {
                    console.log("Cleaning up dead session discovered via registry mismatch: " + peerId);
                    teardownMeshPeer(peerId);
                }
            });

            peers.forEach(peer => {
                if (peer.id !== myId) {
                    count++;
                    const row = document.createElement('div');
                    row.className = 'peer-row';
                    
                    const isConnected = peerConnections.has(peer.id);
                    const btnText = isConnected ? "Hangup" : "Call";
                    const btnClass = isConnected ? "hangup-btn" : "";
                    const clickAction = isConnected ? `handleManualHangup('${peer.id}')` : `initiateOutboundCall('${peer.id}')`;

                    const dynamicDisplayName = peer.name || peer.id;

                    row.innerHTML = `
                        <span><strong>${dynamicDisplayName}</strong> (${peer.type})</span>
                        <button id="btn_${peer.id}" class="${btnClass}" onclick="${clickAction}">${btnText}</button>
                    `;
                    container.appendChild(row);
                }
            });
            if(count === 0) container.innerText = "Nobody online.";
        }

        function togglePeerButton(peerId, isConnected) {
            const btn = document.getElementById(`btn_${peerId}`);
            if (!btn) return;

            btn.disabled = false; // Ensure button becomes clickable again

            if (isConnected) {
                btn.innerText = "Hangup";
                btn.className = "hangup-btn";
                btn.onclick = () => handleManualHangup(peerId);
            } else {
                btn.innerText = "Call";
                btn.className = "";
                btn.onclick = () => initiateOutboundCall(peerId);
            }
        }

        async function initiateOutboundCall(targetPeerId) {
            if(!isMediaActive) return;
            console.log("User clicked call button. Initiating pipeline to: " + targetPeerId);
            const btn = document.getElementById(`btn_${targetPeerId}`);
            if (btn) { btn.innerText = "Calling..."; btn.disabled = true; }

            const pc = createMeshPeerConnection(targetPeerId);
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: 'offer', targetId: targetPeerId, sdp: offer.sdp }));
            } catch (err) {
                console.error("Failed creating outbound offer:", err);
                togglePeerButton(targetPeerId, false);
            }
        }

        function handleManualHangup(targetPeerId) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'hangup', targetId: targetPeerId }));
            }
            teardownMeshPeer(targetPeerId);
        }

        function createMeshPeerConnection(peerId) {
            if(peerConnections.has(peerId)) return peerConnections.get(peerId);

            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections.set(peerId, pc);
            if (!iceQueues.has(peerId)) iceQueues.set(peerId, []);

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    setTimeout(() => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'ice-candidate', targetId: peerId, candidate: event.candidate }));
                        }
                    }, 40); 
                }
            };

            pc.ontrack = (event) => {
                let videoElement = document.getElementById("video_" + peerId);
                if (!videoElement) {
                    const grid = document.getElementById('videoGrid');
                    const box = document.createElement('div');
                    box.className = 'video-box';
                    box.id = "box_" + peerId;
                    
                    videoElement = document.createElement('video');
                    videoElement.id = "video_" + peerId;
                    videoElement.autoplay = true;
                    videoElement.playsInline = true;
                    
                    const label = document.createElement('div');
                    label.className = 'peer-label';
                    label.innerText = "Peer: " + peerId;
                    
                    box.appendChild(videoElement);
                    box.appendChild(label);
                    grid.appendChild(box);
                }
                if (event.streams && event.streams[0]) {
                    videoElement.srcObject = event.streams[0];
                }
            };

            return pc;
        }

        function teardownMeshPeer(peerId) {
            console.log("Executing teardown on local peer reference structures for: " + peerId);
            
            const pc = peerConnections.get(peerId);
            if (pc) { 
                try {
                    pc.getReceivers().forEach(receiver => { 
                        if (receiver.track) receiver.track.stop(); 
                    });
                    pc.close(); 
                } catch (e) {
                    console.warn("Context cleanup warning during track release: ", e);
                }
                peerConnections.delete(peerId); 
            }
            
            iceQueues.delete(peerId);

            const box = document.getElementById("box_" + peerId);
            if (box) {
                box.remove();
            }
            
            togglePeerButton(peerId, false);
        }
        
    </script>
</body>
</html>
