name: call
description: "Family Video Calling"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.12.0
  web_socket_channel: ^3.0.3
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.2
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  
  # Default fallback image for older devices
  image_path: "assets/icon/call.png" 
  
  # Android 10 Adaptive Icon Specifications
  adaptive_icon_background: "#000000" # Your solid background color
  adaptive_icon_foreground: "assets/icon/call.png"
